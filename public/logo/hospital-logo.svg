<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Neon Red Outer Glow -->
    <filter id="neonGlowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Red Linear Gradient -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Dark Carbon Background -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#centerGlow)"/>

  <!-- Outer Neon Hexagon/Shield Border -->
  <polygon points="250,25 440,115 440,385 250,475 60,385 60,115"
           fill="url(#darkBg)" 
           stroke="url(#redGradient)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#neonGlowRed)"/>

  <!-- Inner Thin Neon White Ring -->
  <polygon points="250,45 420,127 420,373 250,455 80,373 80,127"
           fill="none" 
           stroke="#ffffff" 
           stroke-width="3" 
           stroke-opacity="0.8"
           stroke-linejoin="round"/>

  <!-- ECG Pulse Neon Line across Center -->
  <path d="M 85,250 L 155,250 L 175,225 L 195,280 L 220,170 L 250,330 L 280,190 L 305,285 L 325,235 L 345,250 L 415,250"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.25"/>

  <!-- Central Red Medical Cross -->
  <g filter="url(#neonGlowRed)">
    <!-- Vertical Cross Bar -->
    <rect x="215" y="125" width="70" height="250" rx="16" fill="url(#redGradient)" stroke="#ffffff" stroke-width="4"/>
    <!-- Horizontal Cross Bar -->
    <rect x="125" y="215" width="250" height="70" rx="16" fill="url(#redGradient)" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Core White Star / Diamond Accent -->
  <polygon points="250,210 270,250 250,290 230,250" fill="#ffffff"/>

  <!-- Caduceus / Rod of Asclepius Minimalist Accent -->
  <circle cx="250" cy="250" r="10" fill="#dc2626"/>

  <!-- Bottom Arch Text: HOSPITAL MANAGEMENT -->
  <path id="textPathBottom" d="M 120,410 Q 250,480 380,410" fill="none"/>
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="4">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      HOSPITAL MANAGEMENT
    </textPath>
  </text>

  <!-- Top Arch Text: SUKKUR MEDICAL NETWORK -->
  <path id="textPathTop" d="M 120,95 Q 250,35 380,95" fill="none"/>
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ef4444" letter-spacing="3">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      RIVER CITY SUKKUR
    </textPath>
  </text>
</svg>
